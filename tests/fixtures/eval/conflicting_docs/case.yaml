case_id: conflicting_docs
description: >-
  The only available documentation describes v2, but the requested target is a
  v1 release. Citing it would be misleading, so the risk must be marked as
  conflicting rather than verified.
dependency: pydantic
source_version: "1.8"
target_version: "1.10.2"
skill_id: pydantic_v1_to_v2
with_docs: true
expect:
  conclusion: evidence_insufficient
  max_verified_risks: 0
  must_cite_paths:
    - src/models.py
  partial: false
