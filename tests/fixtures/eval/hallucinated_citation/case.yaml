case_id: hallucinated_citation
description: >-
  The model report cites one genuine evidence id and one that does not exist.
  This is the case the whole verifier exists for: the fabricated risk must be
  quarantined while the genuine one still gets through.
dependency: pydantic
source_version: "1.10"
target_version: "2.7"
skill_id: pydantic_v1_to_v2
with_docs: true
model_report: model_report.json
expect:
  conclusion: impacted
  min_verified_risks: 1
  max_verified_risks: 1
  must_cite_paths:
    - src/models.py
  must_quarantine_risk_ids:
    - r-fabricated
  partial: false
