<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>upgradelens 升级影响助手</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1d212b;
    --border: #2a2f3a;
    --text: #e6e8ee;
    --muted: #9aa3b2;
    --accent: #4f8cff;
    --green: #34c759;
    --amber: #ffb020;
    --red: #ff5b5b;
    --purple: #b06bff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  header {
    padding: 0.8rem 1rem;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  header h1 { margin: 0; font-size: 1.05rem; }
  header .sub { color: var(--muted); font-size: 0.8rem; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 1rem; }
  .composer {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }
  .composer input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 0.7rem 0.9rem;
    font-size: 0.95rem;
  }
  .composer button, .quick select {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0.7rem 1rem;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .composer button:disabled { opacity: 0.5; cursor: default; }
  .quick { display: flex; gap: 0.5rem; margin-bottom: 1rem; align-items: center; }
  .quick select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .msg { margin-bottom: 1rem; }
  .msg .who { font-size: 0.78rem; color: var(--muted); margin-bottom: 0.25rem; }
  .bubble {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.9rem 1rem;
  }
  .bubble.user { background: var(--panel-2); }
  .result-section { background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 0 0 0.5rem; margin-top: 0.4rem; }
  .result-header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem;
    padding: 0.9rem 1rem 0.4rem;
  }
  .result-header h2 { margin: 0; font-size: 1.1rem; }
  .badges { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-left: auto; }
  .badge {
    font-size: 0.72rem; padding: 0.18rem 0.55rem; border-radius: 999px;
    border: 1px solid var(--border); color: var(--muted); white-space: nowrap;
  }
  .badge.mode-static { color: #c7cdd9; border-color: #3a4150; }
  .badge.mode-model { color: #9cc2ff; border-color: #2f4d80; background: #16243d; }
  .badge.kb-hit { color: #8be0a4; border-color: #2c5c3c; background: #14271a; }
  .badge.online-supplement { color: #d6b3ff; border-color: #553a82; background: #241733; }
  .badge.kb-writing { color: #ffd98a; border-color: #6b531f; background: #2a2113; }
  .badge.kb-failed { color: #ffb3b3; border-color: #6b2f2f; background: #2a1515; }
  .summary {
    padding: 0.8rem 1rem; border-bottom: 1px solid var(--border);
    display: grid; grid-template-columns: max-content 1fr; gap: 0.3rem 1rem;
  }
  .summary dt { color: var(--muted); }
  .summary dd { margin: 0; }
  .section { padding: 0.9rem 1rem; border-bottom: 1px solid var(--border); }
  .section:last-child { border-bottom: none; }
  .section > h3 { margin: 0 0 0.7rem; font-size: 1rem; }
  .pill {
    display: inline-block; font-size: 0.72rem; padding: 0.1rem 0.5rem;
    border-radius: 999px; border: 1px solid var(--border);
    color: var(--muted); margin-left: 0.4rem;
  }
  .pill.critical, .pill.high { color: var(--red); border-color: #6b2f2f; }
  .pill.medium { color: var(--amber); border-color: #6b531f; }
  .pill.verified { color: var(--green); border-color: #2c5c3c; }
  .pill.partially_verified { color: var(--amber); border-color: #6b531f; }
  .pill.insufficient_evidence, .pill.conflicting_evidence, .pill.not_applicable {
    color: var(--muted); border-color: #3a4150; }
  .finding {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 10px; padding: 0.8rem 0.9rem; margin-bottom: 0.8rem;
  }
  .finding h4 { margin: 0 0 0.4rem; font-size: 0.98rem; }
  .finding .detail { color: #c7cdd9; font-size: 0.9rem; }
  .finding .reco { margin-top: 0.5rem; font-size: 0.92rem; }
  .finding .reco b { color: var(--text); }
  .unconfirmed { background: #241f12; border-color: #6b531f; }
  .unconfirmed .hint {
    margin-top: 0.5rem; font-size: 0.85rem; color: var(--amber);
  }
  .refs, .docs { margin-top: 0.5rem; }
  .refs summary, .docs summary, details.fold > summary {
    cursor: pointer; color: var(--accent); font-size: 0.85rem;
    list-style: none; user-select: none;
  }
  .refs summary::-webkit-details-marker,
  .docs summary::-webkit-details-marker { display: none; }
  .code { display: block; background: #0b0d11; border: 1px solid var(--border);
    border-radius: 8px; padding: 0.6rem 0.7rem; overflow-x: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.82rem; color: #d6dbe6; margin-top: 0.4rem; }
  .loc { color: var(--muted); font-size: 0.8rem; }
  .docitem { padding: 0.4rem 0; border-top: 1px dashed var(--border); }
  .docitem a { color: var(--accent); text-decoration: none; }
  .docitem a:hover { text-decoration: underline; }
  .trust { font-size: 0.72rem; padding: 0.05rem 0.4rem; border-radius: 999px;
    border: 1px solid var(--border); color: var(--muted); margin-left: 0.3rem; }
  .trust.official { color: #8be0a4; border-color: #2c5c3c; }
  .trust.community { color: #ffd98a; border-color: #6b531f; }
  .trust.unverified { color: var(--muted); }
  .plan-step { background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 8px; padding: 0.6rem 0.8rem; margin-bottom: 0.6rem; }
  .plan-step .meta { color: var(--muted); font-size: 0.8rem; margin-top: 0.3rem; }
  .tests { margin: 0; padding-left: 1.1rem; }
  .tests li { margin: 0.2rem 0; }
  details.fold { margin-top: 0.4rem; }
  details.fold > summary { padding: 0.5rem 1rem; color: var(--muted); }
  .fold-body { padding: 0 1rem 1rem; }
  .trace-item, .plan-row { padding: 0.4rem 0; border-top: 1px solid var(--border);
    font-size: 0.88rem; }
  .trace-item .t { color: var(--accent); }
  .cost { font-size: 0.85rem; color: var(--muted); }
  .cost code { color: var(--text); }
  .degrade { color: var(--amber); font-size: 0.88rem; }
  .error { color: var(--red); }
  .loading { color: var(--muted); font-style: italic; }
  footer { color: var(--muted); font-size: 0.75rem; text-align: center;
    padding: 1rem; }
  .scan-bar { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
  .scan-bar input { flex: 1; background: var(--panel); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 0.7rem 0.9rem; font-size: 0.95rem; }
  .scan-bar button { background: var(--purple); color: #fff; border: none;
    border-radius: 8px; padding: 0.7rem 1rem; font-size: 0.95rem; cursor: pointer; white-space: nowrap; }
  .scan-bar button:disabled { opacity: 0.5; cursor: default; }
  .scan-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; margin-top: 0.5rem; }
  .scan-table th, .scan-table td { padding: 0.5rem 0.6rem; border: 1px solid var(--border);
    text-align: left; }
  .scan-table th { background: var(--panel-2); color: var(--muted); font-weight: 600; }
  .scan-table tr:hover { background: var(--panel-2); }
  .scan-table .status-upgradable { color: var(--green); font-weight: 600; }
  .scan-table .status-up_to_date { color: var(--muted); }
  .scan-table .status-unresolved { color: var(--amber); }
  .scan-table .status-lookup_failed { color: var(--red); }
  .scan-table .cross-major { color: var(--red); font-weight: 600; }
  .scan-table input[type="text"] { background: var(--panel); border: 1px solid var(--border);
    color: var(--text); border-radius: 4px; padding: 0.3rem 0.5rem; width: 7em; font-size: 0.85rem; }
  .scan-actions { margin-top: 0.8rem; display: flex; gap: 0.5rem; }
  .scan-actions button { background: var(--accent); color: #fff; border: none;
    border-radius: 8px; padding: 0.6rem 1.2rem; cursor: pointer; font-size: 0.9rem; }
  .scan-actions button:disabled { opacity: 0.5; cursor: default; }
  /* E2: Progress bar */
  .progress-bar { height: 4px; background: var(--border); border-radius: 2px; margin: 0.5rem 0; overflow: hidden; }
  .progress-bar .fill { height: 100%; background: var(--accent); transition: width 0.3s; }
  .job-status { font-size: 0.82rem; color: var(--muted); margin: 0.3rem 0; }
  .job-status .running { color: var(--accent); }
  .job-status .succeeded { color: var(--green); }
  .job-status .failed { color: var(--red); }
  /* E2: Timeline (swimlane) */
  .timeline { margin-top: 1rem; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .timeline-header { display: flex; background: var(--panel-2); border-bottom: 1px solid var(--border); }
  .timeline-header .lane-label { flex: 1; padding: 0.4rem 0.6rem; font-size: 0.75rem;
    color: var(--muted); text-align: center; border-right: 1px solid var(--border); font-weight: 600; }
  .timeline-header .lane-label:last-child { border-right: none; }
  .timeline-body { position: relative; min-height: 60px; }
  .timeline-row { display: flex; border-bottom: 1px solid var(--border); }
  .timeline-row:last-child { border-bottom: none; }
  .lane-cell { flex: 1; min-height: 32px; border-right: 1px solid var(--border); padding: 0.2rem; display: flex; align-items: center; justify-content: center; }
  .lane-cell:last-child { border-right: none; }
  .lane-card { font-size: 0.72rem; padding: 0.2rem 0.5rem; border-radius: 4px;
    background: var(--panel); border: 1px solid var(--border); white-space: nowrap; }
  .lane-card.ok { border-color: var(--green); color: var(--green); }
  .lane-card.error { border-color: var(--red); color: var(--red); }
  .lane-card.running { border-color: var(--accent); color: var(--accent); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  /* E2: Plan panel */
  .plan-panel { margin-top: 1rem; }
  .plan-panel h3 { margin: 0 0 0.5rem; font-size: 0.95rem; }
  .plan-card { display: flex; align-items: center; gap: 0.6rem; padding: 0.5rem 0.8rem;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 0.5rem; }
  .plan-card .seq { width: 1.6rem; height: 1.6rem; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700;
    background: var(--panel-2); color: var(--muted); flex-shrink: 0; }
  .plan-card .seq.done { background: var(--green); color: #fff; }
  .plan-card .seq.running { background: var(--accent); color: #fff; }
  .plan-card .seq.failed { background: var(--red); color: #fff; }
  .plan-card .info { flex: 1; }
  .plan-card .info .name { font-weight: 600; font-size: 0.88rem; }
  .plan-card .info .desc { font-size: 0.78rem; color: var(--muted); }
  .plan-card .status-pill { font-size: 0.72rem; padding: 0.15rem 0.5rem; border-radius: 999px;
    border: 1px solid var(--border); color: var(--muted); }
  .plan-card .status-pill.succeeded { color: var(--green); border-color: var(--green); }
  .plan-card .status-pill.running { color: var(--accent); border-color: var(--accent); }
  .plan-card .status-pill.failed { color: var(--red); border-color: var(--red); }
</style>
</head>
<body>
<header>
  <h1>upgradelens 升级影响助手</h1>
  <div class="sub">把"我要升级 pydantic 到 2.x"之类的目标发给我，我会给出破坏性变更、修改建议和可执行的升级计划。</div>
</header>

<div class="wrap">
  <div class="composer">
    <input id="input" type="text" placeholder="例如：把 pydantic 升级到 2.7" />
    <button id="send">发送</button>
  </div>
  <div class="quick">
    <label for="mode">运行模式</label>
    <select id="mode">
      <option value="fake">fake（离线模拟，演示默认）</option>
      <option value="live">live（真实模型）</option>
    </select>
    <label for="dep">依赖</label>
    <select id="dep">
      <option value="pydantic">pydantic</option>
      <option value="fastapi">fastapi</option>
      <option value="requests">requests</option>
      <option value="celery">celery</option>
      <option value="sqlalchemy">sqlalchemy</option>
    </select>
  </div>
  <div class="scan-bar">
    <input id="scan-repo" type="text" placeholder="仓库路径（如 /path/to/project）" />
    <button id="scan-btn">扫描可升级依赖</button>
  </div>
  <div id="scan-result" style="display:none;"></div>
  <div id="log"></div>
</div>

<footer>upgradelens-agent · 纯静态演示（零额外 Web 框架）</footer>

<script>
function esc(s) {
  if (s === null || s === undefined) return "";
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}
function el(tag, attrs, children) {
  const n = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === "class") n.className = attrs[k];
    else if (k === "html") n.innerHTML = attrs[k];
    else n.setAttribute(k, attrs[k]);
  }
  if (children) (Array.isArray(children) ? children : [children]).forEach((c) => {
    if (c == null) return;
    n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return n;
}

// ----------------------------------------------------------------------- badges
function renderBadges(badges) {
  const wrap = el("div", { class: "badges" });
  (badges || []).forEach((b) =>
    wrap.appendChild(el("span", { class: "badge " + esc(b.kind) }, b.text))
  );
  return wrap;
}

// ------------------------------------------------------------------- code refs
function renderCodeRefs(refs) {
  if (!refs || !refs.length) return null;
  const d = el("details", { class: "refs" }, [
    el("summary", null, "代码位置（" + refs.length + "）"),
  ]);
  refs.forEach((r) => {
    const loc = esc(r.file) + (r.line_start ? ":" + r.line_start : "");
    const head = el("div", { class: "loc" }, loc + (r.symbol ? "  ·  " + esc(r.symbol) : ""));
    d.appendChild(head);
    if (r.note) d.appendChild(el("div", { class: "loc" }, esc(r.note)));
    if (r.snippet) d.appendChild(el("code", { class: "code" }, esc(r.snippet)));
  });
  return d;
}

// ----------------------------------------------------------------------- docs
function renderDocs(docs) {
  if (!docs || !docs.length) return null;
  const d = el("details", { class: "docs" }, [
    el("summary", null, "文档证据（" + docs.length + "）"),
  ]);
  docs.forEach((doc) => {
    const title = doc.url
      ? el("a", { href: esc(doc.url), target: "_blank", rel: "noopener" }, esc(doc.title || doc.url))
      : el("span", null, esc(doc.title || "（无标题文档）"));
    const trust = doc.trust
      ? el("span", { class: "trust " + esc(doc.trust) }, esc(doc.trust))
      : null;
    const meta = [
      doc.source ? el("span", { class: "loc" }, "来源：" + esc(doc.source)) : null,
      doc.version_range ? el("span", { class: "loc" }, "版本：" + esc(doc.version_range)) : null,
      doc.heading ? el("span", { class: "loc" }, "章节：" + esc(doc.heading)) : null,
    ].filter(Boolean);
    d.appendChild(el("div", { class: "docitem" }, [title, trust, ...meta]));
  });
  return d;
}

// -------------------------------------------------------------------- finding
function renderFinding(f, kind) {
  const cls = "finding" + (kind === "unconfirmed" ? " unconfirmed" : "");
  const node = el("div", { class: cls });
  const sev = f.severity ? el("span", { class: "pill " + esc(f.severity) }, esc(f.severity)) : null;
  const stat = f.evidence_status
    ? el("span", { class: "pill " + esc(f.evidence_status) }, esc(f.evidence_status))
    : null;
  node.appendChild(el("h4", null, [esc(f.title || "未命名问题"), sev, stat]));
  if (f.detail) node.appendChild(el("div", { class: "detail" }, esc(f.detail)));
  if (f.recommendation)
    node.appendChild(el("div", { class: "reco" }, [el("b", null, "建议："), esc(f.recommendation)]));
  const refs = renderCodeRefs(f.code_refs);
  if (refs) node.appendChild(refs);
  const docs = renderDocs(f.docs);
  if (docs) node.appendChild(docs);
  if (f.migration) {
    const m = f.migration;
    if (m.before) node.appendChild(el("div", { class: "loc" }, "修改前"));
    if (m.before) node.appendChild(el("code", { class: "code" }, esc(m.before)));
    if (m.after) node.appendChild(el("div", { class: "loc" }, "修改后"));
    if (m.after) node.appendChild(el("code", { class: "code" }, esc(m.after)));
    if (m.steps && m.steps.length) {
      const ul = el("ul", { class: "tests" });
      m.steps.forEach((s) => ul.appendChild(el("li", null, esc(s))));
      node.appendChild(el("div", { class: "loc" }, "迁移步骤"));
      node.appendChild(ul);
    }
    if (m.verification) node.appendChild(el("div", { class: "loc" }, "验证：" + esc(m.verification)));
  }
  if (f.verification && !(f.migration && f.migration.verification))
    node.appendChild(el("div", { class: "loc" }, "验证：" + esc(f.verification)));
  if (f.plan_step_ref)
    node.appendChild(el("div", { class: "loc" }, "对应计划步骤：" + esc(f.plan_step_ref)));
  if (kind === "unconfirmed")
    node.appendChild(
      el("div", { class: "hint" },
        "证据不足：此问题尚未验证，不作为确定性修改动作；下一步请补齐缺失的文档或代码证据后再确认。")
    );
  return node;
}

// --------------------------------------------------------------------- summary
function renderSummary(a) {
  const dl = el("dl", { class: "summary" });
  const row = (k, v) => { dl.appendChild(el("dt", null, k)); dl.appendChild(el("dd", null, v)); };
  row("升级对象", esc(a.dependency || "—"));
  row("版本范围", esc(a.source_version || "?") + "  →  " + esc(a.target_version || "?"));
  row("结论", esc(a.conclusion || "—"));
  row("判定", esc(a.verdict || "—"));
  if (a.is_partial) row("完整性", "部分验证（证据不完整）");
  if (a.note) row("备注", esc(a.note));
  return dl;
}

// ----------------------------------------------------------------------- Plan panel (aligned with AgentPlanStep)
function renderPlanPanel(plan) {
  if (!plan || !plan.steps || !plan.steps.length) return null;
  const panel = el("div", { class: "plan-panel" });
  panel.appendChild(el("h3", null, "Agent 执行计划"));
  plan.steps.forEach((step, i) => {
    const s = step.status || "pending";
    const statusCls = s === "succeeded" || s === "done" ? "done" :
                      s === "running" ? "running" :
                      s === "failed" ? "failed" : "";
    const card = el("div", { class: "plan-card" }, [
      el("div", { class: "seq " + statusCls }, String(step.seq || i + 1)),
      el("div", { class: "info" }, [
        el("div", { class: "name" }, esc(step.tool || step.name || "步骤 " + (i + 1))),
        el("div", { class: "desc" }, esc(step.reason || step.purpose || step.description || "")),
      ]),
      el("span", { class: "status-pill " + s }, esc(s)),
    ]);
    // Show observation if available
    if (step.observation) {
      card.appendChild(el("div", { class: "desc", style: "margin-top:0.3rem;font-size:0.78rem;color:var(--muted)" },
        "结果：" + esc(step.observation)));
    }
    panel.appendChild(card);
  });
  return panel;
}

// ----------------------------------------------------------------------- Timeline (aligned with real trace tool field)
const _PHASE_MAP = {
  scan_code: "代码扫描", scan_dependency: "代码扫描",
  retrieve_for_package: "检索", retrieve: "检索",
  breaking_change_extractor: "分析", impact_analyzer: "分析", analyse: "分析",
  verify_report: "验证", verify: "验证",
  online_fallback: "联网", discover_fetch_retrieve: "联网",
};
const _LANE_ORDER = ["代码扫描", "检索", "分析", "验证", "联网"];

function renderTimeline(trace) {
  if (!trace || !trace.length) return null;
  const container = el("div", { class: "timeline" });
  const header = el("div", { class: "timeline-header" });
  _LANE_ORDER.forEach(lane => {
    header.appendChild(el("div", { class: "lane-label" }, lane));
  });
  container.appendChild(header);
  const body = el("div", { class: "timeline-body" });
  trace.forEach(t => {
    const tool = t.tool || "";
    const lane = _PHASE_MAP[tool] || _LANE_ORDER.find(l => tool.includes(l)) || null;
    if (!lane) return;
    const row = el("div", { class: "timeline-row" });
    _LANE_ORDER.forEach(l => {
      const cell = el("div", { class: "lane-cell" });
      if (l === lane) {
        const cls = "lane-card " + (t.status === "ok" ? "ok" : t.status === "error" ? "error" : "");
        const label = tool.length > 18 ? tool.slice(0, 16) + "…" : tool;
        cell.appendChild(el("span", { class: cls }, esc(label)));
      }
      row.appendChild(cell);
    });
    body.appendChild(row);
  });
  container.appendChild(body);
  return container;
}

// --------------------------------------------------------------------- result (no monkey-patch)
function renderResult(result) {
  const a = result.assessment || {};
  const section = el("div", { class: "result-section" });

  // 1) header + badges
  const header = el("div", { class: "result-header" }, [
    el("h2", null, "升级评估结果"),
    renderBadges(result.badges),
  ]);
  section.appendChild(header);

  // 2) summary
  section.appendChild(renderSummary(a));

  // 3) verified findings
  if (a.verified_risks && a.verified_risks.length) {
    const blk = el("div", { class: "section" }, [
      el("h3", null, "已验证问题（" + a.verified_risks.length + "）"),
    ]);
    a.verified_risks.forEach((f) => blk.appendChild(renderFinding(f, "verified")));
    section.appendChild(blk);
  } else if (!a.degraded_risks || !a.degraded_risks.length) {
    section.appendChild(
      el("div", { class: "section" },
        el("div", { class: "loc" },
          "本次运行未识别出已验证或待确认的破坏性变更（详见上方结论与降级说明）。"))
    );
  }

  // 4) unconfirmed (yellow) zone
  if (a.degraded_risks && a.degraded_risks.length) {
    const blk = el("div", { class: "section" }, [
      el("h3", null, "待确认问题（" + a.degraded_risks.length + "）"),
    ]);
    a.degraded_risks.forEach((f) => blk.appendChild(renderFinding(f, "unconfirmed")));
    section.appendChild(blk);
  }

  // 5) recommended tests
  if (a.recommended_tests && a.recommended_tests.length) {
    const ul = el("ul", { class: "tests" });
    a.recommended_tests.forEach((t) => ul.appendChild(el("li", null, esc(t))));
    section.appendChild(el("div", { class: "section" }, [
      el("h3", null, "推荐测试"),
      ul,
    ]));
  }

  // 6) upgrade plan
  if (result.upgrade_plan && result.upgrade_plan.steps && result.upgrade_plan.steps.length) {
    const blk = el("div", { class: "section" }, [el("h3", null, "升级修改计划")]);
    result.upgrade_plan.steps.forEach((s) => {
      const meta = [
        s.target_files && s.target_files.length ? "目标文件：" + s.target_files.join(", ") : null,
        s.api_symbols && s.api_symbols.length ? "API：" + s.api_symbols.join(", ") : null,
        s.evidence_status ? "证据：" + esc(s.evidence_status) : null,
        s.status ? "状态：" + esc(s.status) : null,
      ].filter(Boolean).join("  ·  ");
      const children = [
        el("div", null, [esc(s.phase || "") + (s.title ? "： " + esc(s.title) : "")]),
        el("div", { class: "meta" }, meta),
        s.detail ? el("div", { class: "detail" }, esc(s.detail)) : null,
      ];
      blk.appendChild(el("div", { class: "plan-step" }, children.filter(Boolean)));
    });
    section.appendChild(blk);
  }

  // 7) Plan panel (Agent execution plan)
  if (result.plan && result.plan.steps) {
    const planEl = renderPlanPanel(result.plan);
    if (planEl) section.appendChild(planEl);
  }

  // 8) Timeline
  if (result.trace && result.trace.length) {
    const timelineEl = renderTimeline(result.trace);
    if (timelineEl) section.appendChild(timelineEl);
  }

  // 9) analysis process (folded): cost / degradations / raw trace
  const fold = el("details", { class: "fold" }, [el("summary", null, "技术详情（成本 / 降级 / 原始 Trace）")]);
  const body = el("div", { class: "fold-body" });
  if (result.cost) {
    const c = result.cost;
    body.appendChild(el("h4", null, "成本"));
    body.appendChild(el("div", { class: "cost" }, [
      el("code", null, "tokens " + (c.total_tokens ?? 0)),
      document.createTextNode("  ·  调用 " + (c.call_count ?? 0) + " 次"),
    ]));
  }
  if (result.degradations && result.degradations.length) {
    body.appendChild(el("h4", null, "降级说明"));
    const ul = el("ul", { class: "tests" });
    result.degradations.forEach((d) => ul.appendChild(el("li", { class: "degrade" }, esc(d))));
    body.appendChild(ul);
  }
  if (result.trace && Array.isArray(result.trace) && result.trace.length) {
    body.appendChild(el("h4", null, "工具调用 Trace"));
    result.trace.forEach((t) =>
      body.appendChild(el("div", { class: "trace-item" }, [
        el("span", { class: "t" }, esc(t.tool)),
        document.createTextNode("：" + esc(t.target || "") + " [" + esc(t.status || "") + "]"),
      ]))
    );
  }
  fold.appendChild(body);
  section.appendChild(fold);

  return section;
}

// ----------------------------------------------------------------------- message log
function addMsg(who, content) {
  const log = document.getElementById("log");
  const msg = el("div", { class: "msg" }, [
    el("div", { class: "who" }, who),
    typeof content === "string" ? el("div", { class: "bubble" }, content) : el("div", { class: "bubble" }, content),
  ]);
  log.appendChild(msg);
  log.scrollTop = log.scrollHeight;
  return msg;
}

// ----------------------------------------------------------------------- SSE helpers
function createProgressUI(container) {
  const statusEl = el("div", { class: "job-status" }, "排队中…");
  const bar = el("div", { class: "progress-bar" }, [el("div", { class: "fill", style: "width:0%" })]);
  container.appendChild(statusEl);
  container.appendChild(bar);
  return { statusEl, bar, fill: bar.firstChild };
}

function connectSSE(jobId, progressUI, onDone) {
  const es = new EventSource("/api/jobs/" + jobId + "/events");
  es.addEventListener("job_started", () => {
    progressUI.statusEl.innerHTML = '<span class="running">执行中…</span>';
    progressUI.fill.style.width = "10%";
  });
  es.addEventListener("step_started", (e) => {
    const d = JSON.parse(e.data);
    progressUI.statusEl.innerHTML = '<span class="running">阶段：' + esc(d.step || d.dependency || "") + '</span>';
    const w = Math.min(90, parseInt(progressUI.fill.style.width) + 12);
    progressUI.fill.style.width = w + "%";
  });
  es.addEventListener("step_finished", (e) => {
    const w = Math.min(95, parseInt(progressUI.fill.style.width) + 8);
    progressUI.fill.style.width = w + "%";
  });
  es.addEventListener("job_succeeded", (e) => {
    progressUI.statusEl.innerHTML = '<span class="succeeded">完成 ✓</span>';
    progressUI.fill.style.width = "100%";
    es.close();
    sessionStorage.removeItem("active_job_id");
    sessionStorage.removeItem("active_job_kind");
    if (onDone) fetchJobResult(jobId, onDone);
  });
  es.addEventListener("job_failed", (e) => {
    const d = JSON.parse(e.data);
    progressUI.statusEl.innerHTML = '<span class="failed">失败：' + esc(d.error || "") + '</span>';
    progressUI.fill.style.width = "100%";
    progressUI.fill.style.background = "var(--red)";
    es.close();
    sessionStorage.removeItem("active_job_id");
    sessionStorage.removeItem("active_job_kind");
  });
  es.onerror = () => {
    es.close();
    setTimeout(() => fetchJobResult(jobId, onDone), 1000);
  };
  return es;
}

async function fetchJobResult(jobId, callback) {
  try {
    const resp = await fetch("/api/jobs/" + jobId);
    const snap = await resp.json();
    if (snap.status === "succeeded" && callback) callback(snap.result);
  } catch (e) { /* ignore */ }
}

// ----------------------------------------------------------------------- send (async assessment)
async function send() {
  const input = document.getElementById("input");
  const goal = input.value.trim();
  if (!goal) return;
  const mode = document.getElementById("mode").value;
  const dep = document.getElementById("dep").value;
  addMsg("你", goal);
  input.value = "";
  const btn = document.getElementById("send");
  btn.disabled = true;

  const msgEl = addMsg("助手", "");
  const bubble = msgEl.querySelector(".bubble");
  bubble.innerHTML = "";
  const progressUI = createProgressUI(bubble);

  try {
    const resp = await fetch("/api/run-async", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ goal, mode, dependency: dep }),
    });
    const data = await resp.json();
    if (data.error) {
      progressUI.statusEl.innerHTML = '<span class="failed">' + esc(data.error) + '</span>';
      btn.disabled = false;
      return;
    }
    // Save for refresh recovery
    sessionStorage.setItem("active_job_id", data.job_id);
    sessionStorage.setItem("active_job_kind", "run");
    connectSSE(data.job_id, progressUI, (result) => {
      bubble.innerHTML = "";
      bubble.appendChild(renderResult(result));
    });
  } catch (e) {
    progressUI.statusEl.innerHTML = '<span class="failed">请求失败：' + esc(String(e)) + '</span>';
  } finally {
    btn.disabled = false;
  }
}

document.getElementById("send").addEventListener("click", send);
document.getElementById("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") send();
});

// ----------------------------------------------------------------------- scan (async)
let _scanResult = null;

function renderScanTable(result) {
  _scanResult = result;
  const container = document.getElementById("scan-result");
  container.style.display = "block";
  container.innerHTML = "";

  const header = el("div", { class: "result-header" }, [
    el("h2", null, "依赖扫描结果"),
    el("span", { class: "badge" }, result.scope || ""),
    el("span", { class: "badge" }, "共 " + (result.items || []).length + " 个依赖"),
  ]);
  container.appendChild(header);

  if (!result.items || !result.items.length) {
    container.appendChild(el("div", { style: "padding:1rem;color:var(--muted)" }, "未发现任何依赖声明。"));
    return;
  }

  const table = el("table", { class: "scan-table" });
  const thead = el("thead", null, [el("tr", null, [
    el("th", null, ""), el("th", null, "包名"), el("th", null, "当前版本"),
    el("th", null, "最新稳定版"), el("th", null, "状态"), el("th", null, "目标版本"),
  ])]);
  table.appendChild(thead);

  const tbody = el("tbody");
  result.items.forEach((item, idx) => {
    const canSelect = item.status === "upgradable";
    const cb = el("input", { type: "checkbox", "data-idx": String(idx) });
    if (canSelect) cb.checked = true; else cb.disabled = true;
    const targetInput = el("input", {
      type: "text", "data-idx": String(idx),
      value: canSelect ? (item.registry_latest || "") : "",
      placeholder: item.status === "unresolved" ? "手填版本" : "",
    });
    if (item.status === "up_to_date" || item.status === "lookup_failed") targetInput.disabled = true;
    targetInput.addEventListener("input", () => {
      if (item.status === "unresolved") cb.disabled = !targetInput.value.trim();
      if (targetInput.value.trim()) cb.checked = true;
    });
    const statusCls = "status-" + item.status;
    const crossMajor = item.cross_major ? el("span", { class: "cross-major" }, " ⚠ 跨主版本") : null;
    const row = el("tr", null, [
      el("td", null, [cb]), el("td", null, item.package),
      el("td", null, item.current_version || (item.current_specifier || "—")),
      el("td", null, item.registry_latest || "—"),
      el("td", null, [el("span", { class: statusCls }, item.status), crossMajor]),
      el("td", null, [targetInput]),
    ]);
    tbody.appendChild(row);
  });
  table.appendChild(tbody);
  container.appendChild(table);

  const actions = el("div", { class: "scan-actions" });
  const assessBtn = el("button", { id: "assess-selected" }, "评估选中项");
  assessBtn.addEventListener("click", assessSelected);
  actions.appendChild(assessBtn);
  container.appendChild(actions);
}

async function doScan() {
  const repoInput = document.getElementById("scan-repo");
  const repo = repoInput.value.trim();
  if (!repo) { alert("请输入仓库路径"); return; }
  const btn = document.getElementById("scan-btn");
  btn.disabled = true;
  btn.textContent = "扫描中…";

  const container = document.getElementById("scan-result");
  container.style.display = "block";
  container.innerHTML = "";
  const progressUI = createProgressUI(container);

  try {
    const resp = await fetch("/api/scan-async", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ repo }),
    });
    const data = await resp.json();
    if (data.error) {
      progressUI.statusEl.innerHTML = '<span class="failed">' + esc(data.error) + '</span>';
      return;
    }
    sessionStorage.setItem("active_job_id", data.job_id);
    sessionStorage.setItem("active_job_kind", "scan");
    connectSSE(data.job_id, progressUI, (result) => {
      container.innerHTML = "";
      renderScanTable(result);
    });
  } catch (e) {
    progressUI.statusEl.innerHTML = '<span class="failed">请求失败：' + esc(String(e)) + '</span>';
  } finally {
    btn.disabled = false;
    btn.textContent = "扫描可升级依赖";
  }
}

async function assessSelected() {
  if (!_scanResult) return;
  const repo = document.getElementById("scan-repo").value.trim();
  const mode = document.getElementById("mode").value;
  const rows = document.querySelectorAll(".scan-table tbody tr");
  const selected = [];
  rows.forEach((row, idx) => {
    const cb = row.querySelector('input[type="checkbox"]');
    const target = row.querySelector('input[type="text"]');
    if (cb && cb.checked && target && target.value.trim()) {
      selected.push({ package: _scanResult.items[idx].package, target_version: target.value.trim() });
    }
  });
  if (!selected.length) { alert("请选择至少一个可评估的依赖"); return; }
  for (const item of selected) {
    const goal = "upgrade " + item.package + " to " + item.target_version;
    addMsg("你", goal + "（来自扫描选择）");
    const msgEl = addMsg("助手", "");
    const bubble = msgEl.querySelector(".bubble");
    bubble.innerHTML = "";
    const progressUI = createProgressUI(bubble);
    try {
      const resp = await fetch("/api/run-async", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ goal, mode, dependency: item.package, target_version: item.target_version, repo }),
      });
      const data = await resp.json();
      if (data.error) {
        progressUI.statusEl.innerHTML = '<span class="failed">' + esc(data.error) + '</span>';
        continue;
      }
      // Wait for this job to complete before starting next
      await new Promise((resolve) => {
        connectSSE(data.job_id, progressUI, (result) => {
          bubble.innerHTML = "";
          bubble.appendChild(renderResult(result));
          resolve();
        });
      });
    } catch (e) {
      progressUI.statusEl.innerHTML = '<span class="failed">请求失败：' + esc(String(e)) + '</span>';
    }
  }
}

document.getElementById("scan-btn").addEventListener("click", doScan);

// ----------------------------------------------------------------------- P0.5: Refresh recovery
(function recoverActiveJob() {
  const jobId = sessionStorage.getItem("active_job_id");
  const jobKind = sessionStorage.getItem("active_job_kind");
  if (!jobId) return;

  fetch("/api/jobs/" + jobId)
    .then(r => r.json())
    .then(snap => {
      if (snap.error) { sessionStorage.removeItem("active_job_id"); return; }
      if (snap.status === "succeeded") {
        sessionStorage.removeItem("active_job_id");
        if (jobKind === "scan" && snap.result) {
          renderScanTable(snap.result);
        } else if (jobKind === "run" && snap.result) {
          addMsg("助手（恢复）", renderResult(snap.result));
        }
        return;
      }
      if (snap.status === "failed") {
        sessionStorage.removeItem("active_job_id");
        addMsg("助手（恢复）", el("div", { class: "error" }, "上次任务失败：" + esc(snap.error || "未知")));
        return;
      }
      // Still running — reconnect SSE
      if (jobKind === "scan") {
        const container = document.getElementById("scan-result");
        container.style.display = "block";
        container.innerHTML = "";
        const progressUI = createProgressUI(container);
        progressUI.statusEl.innerHTML = '<span class="running">恢复中…</span>';
        connectSSE(jobId, progressUI, (result) => {
          container.innerHTML = "";
          renderScanTable(result);
        });
      } else {
        const msgEl = addMsg("助手（恢复）", "");
        const bubble = msgEl.querySelector(".bubble");
        bubble.innerHTML = "";
        const progressUI = createProgressUI(bubble);
        progressUI.statusEl.innerHTML = '<span class="running">恢复中…</span>';
        connectSSE(jobId, progressUI, (result) => {
          bubble.innerHTML = "";
          bubble.appendChild(renderResult(result));
        });
      }
    })
    .catch(() => sessionStorage.removeItem("active_job_id"));
})();
</script>
