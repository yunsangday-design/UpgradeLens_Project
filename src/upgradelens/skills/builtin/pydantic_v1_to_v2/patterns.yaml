- id: pydantic_validator
  kind: decorator
  match: validator
  usage_type: deprecated_decorator
  risk_hint: "pydantic v1 @validator 在 v2 中弃用，应迁移到 @field_validator。"
  retrieval_queries:
    - "pydantic v1 validator migration to field_validator"
    - "pydantic migration guide validator root_validator"
  severity: high
  confidence: high

- id: pydantic_root_validator
  kind: decorator
  match: root_validator
  usage_type: deprecated_decorator
  risk_hint: "pydantic v1 @root_validator 在 v2 中弃用，应迁移到 @model_validator。"
  retrieval_queries:
    - "pydantic v1 root_validator migration to model_validator"
  severity: high
  confidence: high

- id: pydantic_config_class
  kind: class_config
  match: Config
  usage_type: model_config
  risk_hint: "v1 内部 Config 类在 v2 中应改为 model_config = ConfigDict(...)。"
  retrieval_queries:
    - "pydantic v1 Config class to model_config"
  severity: medium
  confidence: high

- id: pydantic_orm_mode
