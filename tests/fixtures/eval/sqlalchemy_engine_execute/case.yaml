case_id: sqlalchemy_engine_execute
dependency: sqlalchemy
source_version: "1.4"
target_version: "2.0"
skill_id: sqlalchemy_v1_to_v2
with_docs: true
description: >
  SQLAlchemy 1.4 -> 2.0: `engine.execute(...)` is removed; the connection /
  text execution path must move to `engine.connect()` + `conn.execute(text(...))`.
expect:
  conclusion: impacted
  must_cite_paths:
    - src/db.py
  must_flag_symbols:
    - execute
    - declarative_base
  max_severity: high
