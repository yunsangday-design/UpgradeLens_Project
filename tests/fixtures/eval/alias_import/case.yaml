case_id: alias_import
description: >-
  The dependency is imported under an alias. Evidence must still resolve to the
  real symbols, otherwise alias-heavy codebases silently look clean.
dependency: pydantic
source_version: "1.10"
target_version: "2.7"
skill_id: pydantic_v1_to_v2
with_docs: true
expect:
  conclusion: impacted
  min_verified_risks: 1
  must_cite_paths:
    - src/api.py
  must_flag_symbols:
    - BaseSettings
  partial: false
