[project]
name = "upgradelens-agent"
version = "0.1.0"
description = "UpgradeLens: evidence-driven dependency upgrade pre-audit agent (stage 0-1: environment baseline and manifest parsing)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "packaging>=26.3",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "pyyaml>=6",
  "sqlalchemy>=2,<3",
  "alembic>=1.13",
  "langgraph>=1.2.10",
  "langchain-openai>=1.4.1",
]

[project.scripts]
upgradelens = "upgradelens.cli:main"

[dependency-groups]
test = [
  "pytest",
  "pytest-cov",
]
lint = [
  "mypy",
  "ruff",
]

[tool.uv]
default-groups = ["test", "lint"]

[tool.uv.build-backend]
module-root = "src"
module-name = "upgradelens"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Fixture repositories contain their own test files, which are *input data* for
# the analyser, not tests of this project. Collecting them would fail on
# unresolvable imports and intentionally broken syntax.
norecursedirs = ["tests/fixtures"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Fixture repositories are test data, not project code; some contain
# intentionally broken or shadowed source, so they must not be linted or
# formatted.
exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
