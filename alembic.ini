# Alembic configuration for UpgradeLens (stage 4).
# The actual database URL is supplied at runtime via the ``--db`` CLI flag or
# the ``UPGRADELENS_DB_URL`` environment variable; it is left blank here so the
# migration tool never writes to an unintended location by default.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
