name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux is where this actually gets deployed (CI runners, containers);
        # macOS and Windows are here because the path/encoding helpers in
        # platform.py exist precisely to keep those two honest.
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync (locked)
        run: uv sync --all-groups --locked

      - name: Tests
        run: uv run pytest

      - name: Alembic migration
        env:
          UPGRADELENS_DB_URL: "sqlite:///./ci_migrated.db"
        run: uv run alembic upgrade head

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src
