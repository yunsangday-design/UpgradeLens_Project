case_id: pydantic_field_validator
dependency: pydantic
source_version: "1.10"
target_version: "2.0"
skill_id: pydantic_v1_to_v2
with_docs: true
description: >
  Pydantic v1 -> v2: @validator is deprecated in favour of @field_validator,
  and settings must subclass BaseSettings (not BaseModel).
expect:
  conclusion: impacted
  must_cite_paths:
    - src/models.py
  must_flag_symbols:
    - validator
    - BaseSettings
  max_severity: high
